[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anhui-public-data-crawler"
version = "0.3.0a1"
description = "Standalone Anhui official public-data collection, provenance and factual storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<2.1", "PyMySQL>=1.1,<3", "pdfplumber>=0.11,<0.12", "lxml>=5,<7", "certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
anhui-crawl = "anhui_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anhui_crawler = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
