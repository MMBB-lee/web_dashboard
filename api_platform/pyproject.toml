[project]
name = "api_platform"
version = "0.1.0"
description = "安徽文旅交通客流观察与预测驾驶舱——后端 API（FastAPI，唯一 HTTP 层）"
# 项目版本约定（C/D/E 统一）：Python 3.13.16（64 位）；数据库 MySQL 8.4.11 LTS
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",  # 知识文档 multipart 上传（20 号接口）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
